name: CI - Standards Compliance & Quality Gates

# 🏗️ COMPREHENSIVE CI/CD VALIDATION (10-15 min)
# Full standards compliance validation with matrix testing across platforms
#
# 📋 Coverage:
#   - GitHub Issues validation (requirements traceability)
#   - Matrix testing: Windows/Linux/macOS × Debug/Release
#   - Architecture compliance (ISO/IEC/IEEE 42010:2011)
#   - Security scanning (Trivy, dependency audits)
#   - Standards compliance reporting (ISO/IEC/IEEE 29148:2018, 12207:2017)
#
# 🔄 Workflow Strategy:
#   1. traceability-check.yml: Fast traceability validation (2-3 min)
#   2. This workflow: Complete CI/CD pipeline (10-15 min)
#
#   On PRs, both workflows run in parallel:
#   - Traceability check: Quick feedback with PR comment
#   - This workflow: Full validation before merge
#
# ⚡ For fast traceability-only checks:
#   → See .github/workflows/traceability-check.yml

on:
  push:
    branches: [master, develop, "feature/**", "release/**"]
    tags: ['v*']
  pull_request:
    branches: [master, develop]
  schedule:
    # Run daily at 2 AM UTC
    - cron: "0 2 * * 0"
  workflow_dispatch:

env:
  NODE_VERSION: "24.x"
  PYTHON_VERSION: "3.11"
  MIN_TEST_COVERAGE: 80
  MAX_CYCLOMATIC_COMPLEXITY: 10
  MIN_REQ_LINKAGE_COVERAGE: 90
  # Minimum % of requirements that must have actual test execution outcomes in CI.
  # 0 = informational only. Raise once hardware-runner coverage reaches a stable baseline.
  MIN_REQ_TEST_COVERAGE: 0
  BUILD_SYSTEM: MSBuild

jobs:
  spec-validation:
    name: GitHub Issues Structure Validation (Requirements & Traceability)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pyyaml PyGithub
      - name: Validate GitHub Issues structure
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔍 Validating GitHub Issues-based requirements structure..."
          python scripts/github-traceability-report.py > /tmp/traceability-check.md

          # Check if any requirements were found
          if grep -q "Total requirements: \*\*0\*\*" /tmp/traceability-check.md; then
            echo "❌ No requirements found in GitHub Issues!"
            echo "Expected issues with labels: phase:02-requirements, phase:03-architecture, etc."
            echo "See docs/QUICK-START-github-issues.md for issue creation guidance"
            cat /tmp/traceability-check.md
            exit 1
          fi

          echo "✅ GitHub Issues requirements structure validated"
          grep "Total requirements:" /tmp/traceability-check.md || echo "Summary not found in report"
  github-issues-generation:
    needs: [spec-validation]
    name: GitHub Issues Artifact Generation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests pyyaml PyGithub
      - name: Generate spec index (placeholder for compatibility)
        run: |
          mkdir -p build
          echo '{"items": [], "source": "github-issues"}' > build/spec-index.json
      - name: Build traceability JSON from GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "📊 Generating traceability.json from GitHub Issues..."
          python scripts/github-issues-to-traceability-json.py
      - name: Generate integrity scan from GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          echo "🔍 Scanning for high-priority requirements..."
          python scripts/github-issues-integrity-scan.py
      - name: Generate requirement test skeletons (placeholder)
        run: |
          mkdir -p 05-implementation/tests/generated
          echo "# Test skeletons generated from GitHub Issues" > 05-implementation/tests/generated/README.md
      - name: Generate human-readable traceability report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p reports
          python scripts/github-traceability-report.py > reports/traceability-report.md
      - name: Upload generated artifacts
        uses: actions/upload-artifact@v6
        with:
          name: spec-generated-artifacts
          path: |
            build/spec-index.json
            build/traceability.json
            build/integrity-scan.json
            05-implementation/tests/generated/
            reports/traceability-report.md
  # Phase 05: Implementation Quality Checks
  # Implements: #252 (TEST-MAINTAIN-001: Verify Code Maintainability Standards)
  # Traces to:  #85 (REQ-NF-MAINTAIN-001)
  code-quality:
    needs: [github-issues-generation]
    name: Code Quality & Standards (IEEE 1016, XP Practices)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Full history for better analysis

      - name: Install analysis tools
        run: |
          pip install lizard
          sudo apt-get install -y clang-format

      # Test 1 & 7: Cyclomatic complexity ≤10 and long function detection (<5% >50 lines)
      # Verifies: #252 (TEST-MAINTAIN-001 steps 1 & 7)
      - name: Test 1+7 — Cyclomatic complexity and long function check (lizard)
        continue-on-error: true
        run: |
          echo "🔍 Running lizard complexity + length analysis on src/..."
          lizard src/ -l c --CCN 10 --length 50 --xml > /tmp/lizard-report.xml || true
          lizard src/ -l c --CCN 10 --length 50 > /tmp/lizard-report.txt || true
          cat /tmp/lizard-report.txt

          # Check for complexity violations (CCN > 10)
          ccn_violations=$(lizard src/ -l c --CCN 10 2>&1 | grep -E "^.*\s+[0-9]+\s+[0-9]+\s+[0-9]+\s+" | awk '$3 > 10' || true)
          if [ -n "$ccn_violations" ]; then
            echo ""
            echo "❌ Functions with cyclomatic complexity >10:"
            echo "$ccn_violations"
            exit 1
          fi

          # Check long function ratio (<5% of functions may exceed 50 lines)
          total_funcs=$(lizard src/ -l c 2>/dev/null | grep -cE "^[[:space:]]+[0-9]" || echo 0)
          long_funcs=$(lizard src/ -l c --length 50 2>/dev/null | grep -E "^[[:space:]]+[0-9]" | awk '$2 > 50' | wc -l || echo 0)
          if [ "$total_funcs" -gt 0 ]; then
            ratio=$(echo "scale=2; $long_funcs * 100 / $total_funcs" | bc)
            echo "Long functions (>50 lines): $long_funcs / $total_funcs ($ratio%)"
            too_many=$(echo "$ratio > 5" | bc)
            if [ "$too_many" = "1" ]; then
              echo "❌ More than 5% of functions exceed 50 lines ($ratio%)"
              exit 1
            fi
          fi
          echo "✅ Complexity and length checks passed"

      # Test 2: Code duplication <3%
      # Verifies: #252 (TEST-MAINTAIN-001 step 2)
      - name: Test 2 — Code duplication detection
        run: |
          echo "🔍 Checking code duplication in src/..."
          # lizard --duplicate reports duplicated tokens; use as a proxy metric
          dup_output=$(lizard src/ -l c --duplicate 2>&1 || true)
          echo "$dup_output"

          # Count duplicate blocks reported (each "Duplicate" line = one block)
          dup_count=$(echo "$dup_output" | grep -c "^Duplicate" || true)
          echo "Duplicate blocks found: $dup_count"

          if [ "$dup_count" -gt 10 ]; then
            echo "❌ Excessive duplication: $dup_count duplicate blocks (threshold: 10)"
            echo "   Extract duplicated logic into shared helper functions."
            exit 1
          fi
          echo "✅ Code duplication within acceptable range ($dup_count blocks)"
        continue-on-error: true  # Phase-in: surface findings without blocking yet

      # Test 3: Function comment coverage (all public functions must have a header comment)
      # Verifies: #252 (TEST-MAINTAIN-001 step 3)
      - name: Test 3 — Public function comment coverage
        run: |
          echo "🔍 Checking public function comment coverage in src/ and include/..."
          missing=0
          total=0

          # For each .c and .h file, find function definitions preceded by no comment
          # Pattern: a line that looks like a function definition not preceded by // or /*
          for f in $(find src include -name "*.c" -o -name "*.h" 2>/dev/null); do
            # Extract line numbers of function definitions (return-type name(...) {)
            # then check if the immediately preceding non-blank line is a comment
            python3 - "$f" <<'PYEOF'
          import sys, re

          path = sys.argv[1]
          try:
              lines = open(path, encoding='utf-8', errors='replace').readlines()
          except Exception:
              sys.exit(0)

          func_re = re.compile(r'^[A-Za-z_][A-Za-z0-9_ *]+\s+[A-Za-z_][A-Za-z0-9_]*\s*\(')
          comment_re = re.compile(r'^\s*(/\*|\*|//)')
          missing = 0
          total = 0
          for i, line in enumerate(lines):
              # Skip preprocessor, blank, typedef, struct, etc.
              stripped = line.strip()
              if not stripped or stripped.startswith('#') or stripped.startswith('typedef') \
                 or stripped.startswith('struct') or stripped.startswith('//') \
                 or stripped.startswith('/*') or stripped.startswith('*'):
                  continue
              if func_re.match(stripped) and '{' in line:
                  total += 1
                  # Walk back to find preceding non-blank line
                  j = i - 1
                  while j >= 0 and not lines[j].strip():
                      j -= 1
                  if j < 0 or not comment_re.match(lines[j]):
                      print(f"  MISSING comment: {path}:{i+1}: {stripped[:80]}")
                      missing += 1
          if total > 0:
              print(f"  {path}: {total - missing}/{total} functions commented")
          sys.exit(1 if missing > 0 else 0)
          PYEOF
            if [ $? -ne 0 ]; then
              missing=$((missing + 1))
            fi
            total=$((total + 1))
          done

          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "❌ $missing file(s) contain public functions missing header comments"
            exit 1
          fi
          echo "✅ Public function comment coverage passed"
        continue-on-error: true  # Phase-in: surface findings without blocking yet

      # Test 4: Coding style compliance (clang-format)
      # Verifies: #252 (TEST-MAINTAIN-001 step 4)
      - name: Test 4 — Coding style compliance (clang-format)
        run: |
          echo "🔍 Running clang-format style check on src/..."

          # Use LLVM style as baseline (closest to WDK/kernel conventions)
          # If a .clang-format file exists at repo root, it will be used automatically.
          style_flag="--style=file"
          if [ ! -f ".clang-format" ]; then
            style_flag="--style={BasedOnStyle: LLVM, IndentWidth: 4, ColumnLimit: 120}"
          fi

          violations=""
          for f in $(find src -name "*.c" -o -name "*.h"); do
            diff_out=$(clang-format $style_flag --dry-run --Werror "$f" 2>&1 || true)
            if [ -n "$diff_out" ]; then
              violations="$violations\n  $f"
            fi
          done

          if [ -n "$violations" ]; then
            echo "⚠️  Style violations found in:"
            echo -e "$violations"
            echo ""
            echo "  Run: clang-format $style_flag -i <file> to auto-fix"
          else
            echo "✅ No clang-format style violations"
          fi
        continue-on-error: true  # Phase-in: report without blocking until .clang-format is baselined

      # Test 5: Dead code / unused symbol detection (surfaced via PREfast — see static-analysis-prefast job)
      # C4505 (unreferenced functions) and C6001 patterns caught there.
      # Verifies: #252 (TEST-MAINTAIN-001 step 5) — complementary check via cppcheck
      - name: Test 5 — Dead code detection (cppcheck)
        run: |
          sudo apt-get install -y cppcheck
          echo "🔍 Running cppcheck for unused functions and unreachable code..."
          cppcheck --enable=unusedFunction --enable=style \
            --suppress=missingIncludeSystem \
            --error-exitcode=0 \
            --template="{file}:{line}: [{severity}] {id}: {message}" \
            src/ 2>&1 | tee /tmp/cppcheck-report.txt || true

          unused=$(grep -c "unusedFunction\|unreadVariable\|unusedVariable" /tmp/cppcheck-report.txt || true)
          echo "Unused symbol findings: $unused"
          if [ "$unused" -gt 0 ]; then
            echo "⚠️  $unused unused symbol(s) detected — review /tmp/cppcheck-report.txt"
          else
            echo "✅ No unused symbols detected"
          fi
        continue-on-error: false  # Phase-in: surface findings without blocking yet

      # Test 6: Magic number detection — handled by ssot-magic-numbers-gate job (closes #305)
      # Verifies: #252 (TEST-MAINTAIN-001 step 6) — see ssot-magic-numbers-gate below

      # Test 8: Upload all analysis results as CI artifacts
      # Verifies: #252 (TEST-MAINTAIN-001 step 8)
      - name: Upload code quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: code-quality-reports
          path: |
            /tmp/lizard-report.txt
            /tmp/lizard-report.xml
            /tmp/cppcheck-report.txt
          retention-days: 30

      - name: Check Markdown documentation
        run: |
          echo "📄 Validating Markdown documentation..."
          pip install mdformat
          find . -name '*.md' ! -path './node_modules/*' ! -path './.pio/*' | head -20 || echo "✅ Markdown check skipped"
        continue-on-error: true

  # Sprint 1 CI Gate: SSOT Magic Numbers Check (closes #305)
  ssot-magic-numbers-gate:
    name: SSOT Gate — No Raw Hex Literals in src/ (closes #305)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check for raw hex literals in src/ (4+ significant digits)
        # Verifies: #305 (REQ-NF-REGS-001 — Eliminate Magic Numbers)
        # Any 0xNNNN pattern in a .c file under src/ that is NOT part of
        # a #define, a comment, or a SSOT-exempt status code block is a
        # violation; all constants must live in include/ SSOT headers.
        run: |
          echo "🔍 SSOT Gate: scanning src/ for raw hex literals (4+ digits)..."

          # Gather violations: 4+ hex digit literals in .c files,
          # excluding preprocessor definitions and comment-only lines.
          violations=$(grep -rEn "0x[0-9A-Fa-f]{4,}" src/ --include="*.c" \
            | grep -Ev "^\s*(//|/\*|\*)"       \
            | grep -Ev "#\s*(define|include)"   \
            | grep -Ev "NTSTATUS|STATUS_"       \
            || true)

          if [ -n "$violations" ]; then
            echo ""
            echo "❌ Raw hex literals (4+ digits) found in src/ — move to include/ SSOT headers:"
            echo "-----------------------------------------------------------------------"
            echo "$violations"
            echo "-----------------------------------------------------------------------"
            echo "Fix: define a named constant in include/intel_pci_ids.h,"
            echo "     include/avb_events.h, or include/avb_ioctl.h and use"
            echo "     the symbolic name instead of the raw literal."
            exit 1
          fi

          echo "✅ No raw 4+ digit hex literals found in src/ — SSOT compliance confirmed"

  # Pillar 1: PREfast static analysis — NDIS LWF kernel driver
  static-analysis-prefast:
    name: Pillar 1 — PREfast Driver Static Analysis (/analyze)
    runs-on: windows-latest
    # Non-blocking phase-in: surfaces C6xxx findings without gating merges.
    # Remove continue-on-error once the baseline reaches zero findings.
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Set up MSVC environment (x64)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows Driver Kit (WDK)
        uses: ./.github/actions/install-wdk

      - name: Run PREfast analysis (Release|x64)
        shell: pwsh
        run: |
          # RunCodeAnalysis=true enables WDK PREfast (/analyze) for the kernel driver.
          # TreatWarningAsError=false overrides the vcxproj setting so all C6xxx findings
          # surface as warnings in the build log, not as hard errors that abort MSBuild.
          # AvbVersionBuild/Revision=0 avoids needing build_number.txt in CI.
          Write-Host "=== PREfast Analysis: Release|x64 ===" -ForegroundColor Cyan
          msbuild IntelAvbFilter.vcxproj `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RunCodeAnalysis=true `
            /p:TreatWarningAsError=false `
            /p:AvbVersionBuild=0 `
            /p:AvbVersionRevision=0 `
            /t:Rebuild `
            2>&1 | Tee-Object prefast-output.txt
          $buildExit = $LASTEXITCODE

          Write-Host ""
          Write-Host "=== PREfast Finding Summary ===" -ForegroundColor Cyan
          $findings = Select-String -Path prefast-output.txt -Pattern 'warning C6\d{3}' |
                      Select-Object -ExpandProperty Line
          $findingCount = $findings.Count
          $colour = if ($findingCount -eq 0) { 'Green' } else { 'Yellow' }
          Write-Host "Total C6xxx findings: $findingCount" -ForegroundColor $colour
          if ($findingCount -gt 0) {
            Write-Host ""
            Write-Host "--- Finding codes (most frequent first) ---"
            $findings |
              Select-String -Pattern 'C6\d{3}' -AllMatches |
              ForEach-Object { $_.Matches } |
              Select-Object -ExpandProperty Value |
              Group-Object |
              Sort-Object Count -Descending |
              ForEach-Object { Write-Host "  $($_.Name): $($_.Count)" }
          }
          exit $buildExit

      - name: Upload PREfast results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: prefast-analysis-results
          path: |
            prefast-output.txt
            build/x64/Release/**/*.nativecodeanalysis.xml
          retention-days: 30

  # Phase 05: TDD - Test-Driven Development
  unit-tests:
    name: Unit Tests (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest,windows-2022]
        config: [Debug, Release]
        hardware: [false]
        # GitHub-hosted only.  Physical HIL runs in .github/workflows/hil.yml (workflow_run after this workflow and
        # its deploy-staging job succeeded on a master push; #328 trust boundary, tests/unit/ci/test_hil_trust_boundary.ps1).
        # Sleep/hibernate tests (test_s3_sleep_wake) remain absent from all automated suites.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Python
        # Skip on self-hosted hardware runners — Python is already installed there.
        # actions/setup-python tries to download/install Python which fails on these
        # machines due to PowerShell execution policy restrictions.
        if: matrix.hardware != true
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML (HIL trust-boundary test parser)
        # tests/unit/ci/test_hil_trust_boundary.ps1 (Unit suite) parses the workflows with PyYAML BaseLoader and fails
        # closed without it (TEST-HILTRUST-000).  Pinned: the version the test was validated with.
        if: runner.os == 'Windows' && matrix.hardware != true
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3

      - name: Install CMake and Build Tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build

      - name: Install CMake and Build Tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Install CMake and Build Tools (Windows)
        if: runner.os == 'Windows' && matrix.hardware != true
        uses: ilammy/msvc-dev-cmd@v1

      - name: Detect and configure build system
        if: matrix.hardware != true
        shell: bash
        run: |
          echo "🔍 Detecting build system..."

          # Check for different project types
          if [ -f "CMakeLists.txt" ]; then
            echo "BUILD_SYSTEM=cmake" >> $GITHUB_ENV
            echo "✅ CMake project detected"
          elif [ -f "platformio.ini" ]; then
            echo "BUILD_SYSTEM=platformio" >> $GITHUB_ENV
            echo "✅ PlatformIO project detected"
          elif [ -f "Makefile" ]; then
            echo "BUILD_SYSTEM=make" >> $GITHUB_ENV
            echo "✅ Makefile project detected"
          elif [ -d "test/test_audio" ] && [ -f "test/test_audio/CMakeLists.txt" ]; then
            echo "BUILD_SYSTEM=cmake-subdir" >> $GITHUB_ENV
            echo "TEST_DIR=test/test_audio" >> $GITHUB_ENV
            echo "✅ CMake test subdirectory detected"
          else
            echo "BUILD_SYSTEM=none" >> $GITHUB_ENV
            echo "⚠️ No standard build system detected"
          fi

      - name: Build and run tests (CMake)
        if: env.BUILD_SYSTEM == 'cmake' || env.BUILD_SYSTEM == 'cmake-subdir'
        shell: bash
        run: |
          if [ -n "${{ env.TEST_DIR }}" ]; then
            cd "${{ env.TEST_DIR }}"
          fi

          echo "🏗️ Building tests (${{ matrix.config }})..."
          cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -G Ninja
          cmake --build build --config ${{ matrix.config }}

          echo "🧪 Running tests..."
          ctest --test-dir build -C ${{ matrix.config }} --output-on-failure || {
            echo "⚠️ Some tests failed (may require hardware or additional setup)"
            exit 0
          }

      - name: Build and run tests (PlatformIO)
        if: env.BUILD_SYSTEM == 'platformio'
        shell: bash
        run: |
          pip install --upgrade platformio
          pio upgrade --dev

          echo "🧪 Running native unit tests..."
          pio test -e native || {
            echo "⚠️ Some tests failed (may require hardware)"
            exit 0
          }

      - name: Build and run tests (Make)
        if: env.BUILD_SYSTEM == 'make'
        shell: bash
        run: |
          echo "🏗️ Building tests..."
          make test CONFIG=${{ matrix.config }} || make test || {
            echo "⚠️ Make build/test failed"
            exit 0
          }

      - name: Install Windows Driver Kit (WDK)
        # Skip on self-hosted hardware runners — WDK is already installed there.
        # Attempting to install/modify WDK on a developer machine risks corrupting
        # the existing build environment. No installations on self-hosted runners.
        if: runner.os == 'Windows' && matrix.hardware != true
        uses: ./.github/actions/install-wdk

      - name: Install test build dependencies (Windows)
        # Skip on self-hosted hardware runners — Npcap SDK and WDK headers must
        # already be present. No downloads or installations on self-hosted runners.
        if: runner.os == 'Windows' && matrix.hardware != true
        shell: pwsh
        run: |
          ## 1. Npcap SDK (required by test_tx_timestamp_retrieval)
          $npcapDest = 'C:\npcap-sdk-1.16'
          if (Test-Path (Join-Path $npcapDest 'Include\pcap.h')) {
            Write-Host " Npcap SDK already present" -ForegroundColor Green
          } else {
            Write-Host " Downloading Npcap SDK 1.16..." -ForegroundColor Cyan
            Invoke-WebRequest -Uri 'https://npcap.com/dist/npcap-sdk-1.16.zip' -OutFile 'C:\npcap-sdk.zip' -UseBasicParsing
            New-Item -ItemType Directory -Path $npcapDest -Force | Out-Null
            Expand-Archive -Path 'C:\npcap-sdk.zip' -DestinationPath $npcapDest -Force
            Remove-Item 'C:\npcap-sdk.zip' -Force
            if (Test-Path (Join-Path $npcapDest 'Include\pcap.h')) {
              Write-Host " Npcap SDK installed at $npcapDest" -ForegroundColor Green
            } else {
              Write-Host " Npcap SDK install unexpected structure; listing:" -ForegroundColor Red
              Get-ChildItem $npcapDest -Recurse | Select-Object -First 20 | Format-Table FullName
            }
          }

          ## 2. TAEF / WEX development headers (required by taef_tests)
          $taefInc = "${env:ProgramFiles(x86)}\Windows Kits\10\Testing\Development\inc"
          $taefLib = "${env:ProgramFiles(x86)}\Windows Kits\10\Testing\Development\lib\x64"
          if ((Test-Path "$taefInc\WexTestClass.h") -and (Test-Path "$taefLib\Wex.Common.lib")) {
            Write-Host " TAEF development headers found in WDK" -ForegroundColor Green
            "TAEF_INCLUDE=$taefInc" >> $env:GITHUB_ENV
            "TAEF_LIB=$taefLib" >> $env:GITHUB_ENV
          } else {
            Write-Host " TAEF headers not at standard WDK path; searching Windows Kits..." -ForegroundColor Yellow
            $found = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter 'WexTestClass.h' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $taefInc = $found.DirectoryName
              Write-Host " Found WexTestClass.h at $taefInc" -ForegroundColor Green
              "TAEF_INCLUDE=$taefInc" >> $env:GITHUB_ENV
              $taefLib = Join-Path (Split-Path $taefInc -Parent) 'lib\x64'
              if (-not (Test-Path "$taefLib\Wex.Common.lib")) { $taefLib = $taefInc }
              "TAEF_LIB=$taefLib" >> $env:GITHUB_ENV
            } else {
              Write-Host " TAEF/WEX headers not found in WDK installation" -ForegroundColor Yellow
              Write-Host "   taef_tests will be skipped (WDK installed without TAEF Testing component)" -ForegroundColor Gray
            }
          }

      - name: Validate PowerShell 5.1 syntax (Windows)
        # Early gate: fail immediately if any CI-critical script has a PS5.1 parser error.
        # Runs BEFORE the build step so a syntax regression never silently reaches tests.
        if: runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: .\tools\ci\Validate-PS1Syntax.ps1

      - name: Build Windows driver tests (Windows)
        if: runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          Write-Host " Building Windows driver test executables (${{ matrix.config }})..." -ForegroundColor Cyan
          .\tools\build\Build-Tests.ps1 -Configuration ${{ matrix.config }}
          Write-Host " Test build complete" -ForegroundColor Green

      - name: Run hardware-independent unit tests (Windows)
        if: runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          # GitHub runner is already Administrator — call Run-Tests-CI.ps1 directly.
          # Run-Tests-Elevated.ps1 uses Start-Process -Verb RunAs (interactive UAC) and is
          # NOT suitable for headless CI.  Run-Tests-CI.ps1 is the correct entry point here.
          .\tools\test\Run-Tests-CI.ps1 -Configuration ${{ matrix.config }} -Suite Unit
 
      - name: Run SSOT & register verification tests (Windows)
        # Verifies: #301 (TEST-SSOT-001), #302 (TEST-SSOT-003), #303 (TEST-SSOT-004)
        #           #304 (TEST-REGS-001), #305 (TEST-REGS-002), #306 (TEST-REGS-003)
        # Static analysis + build artifact checks — no hardware required.
        if: runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          $ErrorActionPreference = 'Stop'
          $failed = 0

          Write-Host " Running SSOT verification tests (#301, #302, #303)..." -ForegroundColor Cyan
          & tests\verification\ssot\Run-All-SSOT-Tests.ps1
          if ($LASTEXITCODE -ne 0) { $failed++ }

          Write-Host ""
          Write-Host " Running REGS verification tests (#304, #305, #306)..." -ForegroundColor Cyan
          & tests\verification\regs\Test-REGS-002-MagicNumberDetection.ps1
          if ($LASTEXITCODE -ne 0) { $failed++ }

          & tests\verification\regs\Test-REGS-001-BuildVerification.ps1 -Configuration ${{ matrix.config }}
          if ($LASTEXITCODE -ne 0) { $failed++ }

          & tests\verification\regs\Test-REGS-003-RegisterConstantVerification.ps1 -Configuration ${{ matrix.config }}
          if ($LASTEXITCODE -ne 0) { $failed++ }

          if ($failed -gt 0) {
            Write-Host ""
            Write-Host " $failed SSOT/REGS verification test(s) failed" -ForegroundColor Red
            exit 1
          }
          Write-Host ""
          Write-Host " All SSOT & register verification tests passed" -ForegroundColor Green

      - name: Hardware-dependent tests (Windows, skipped — no Intel NIC on runner)
        if: runner.os == 'Windows' && matrix.hardware == false
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          Write-Host "[INFO] Hardware-dependent tests (avb_test_i226, avb_test_i210, ptp_clock_control_test, "
          Write-Host "       tsauxc_toggle_test, device_open_test) require a supported Intel NIC."
          Write-Host "[INFO] These tests are NOT run on CI runners -- execute them manually on a machine with hardware."

      - name: Mark workspace safe for git (self-hosted ownership fix)
        # Fix: dorny/test-reporter runs git ls-files; on self-hosted runners the
        # workspace is owned by NETWORK SERVICE but the job runs as SYSTEM, causing
        # git to refuse the repo. Adding safe.directory resolves exit code 128.
        if: always() && runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: git config --global --add safe.directory "${{ github.workspace }}"

      - name: Publish unit test results (JUnit)
        # Surfaces JUnit XML generated by Run-Tests-CI.ps1 → Convert-Logs-To-JUnit.ps1
        # into the GitHub Actions test-results UI for both GitHub-hosted and self-hosted runners.
        # Paths are scoped to Unit and HardwareUnit suites only so the shared self-hosted
        # workspace's HardwareMandatory XML (from the HIL Gate job) is never picked up here.
        if: always() && runner.os == 'Windows'
        uses: dorny/test-reporter@v2
        with:
          name: 'Unit Tests (${{ matrix.os }}, ${{ matrix.config }})'
          # Comma-separated: test-reporter does not split a multi-line value - the whole block was ONE pattern and
          # matched nothing (run 40840781230: "No file matches path logs\junit-Unit-Debug-*.xml<LF>logs\junit-...").
          path: 'logs/junit-Unit-${{ matrix.config }}-*.xml,logs/junit-HardwareUnit-${{ matrix.config }}-*.xml'
          reporter: java-junit
          fail-on-empty: 'false'
          path-replace-backslashes: 'true'

      - name: Publish traceability summary
        # Append the GitHub-issue traceability table generated by Convert-Logs-To-JUnit.ps1
        # to the Actions job summary, so test results link back to GitHub issues.
        if: always() && runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          $mdFile = Get-ChildItem 'logs' -Filter 'traceability-summary-*.md' -ErrorAction SilentlyContinue |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($mdFile) {
              Get-Content $mdFile.FullName -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Write-Host "[OK] Traceability summary appended to job summary" -ForegroundColor Green
          } else {
              Write-Host "[INFO] No traceability summary found in logs/" -ForegroundColor Yellow
          }

      - name: Upload traceability summary artifact
        # Upload the execution traceability summary so the Traceability Coverage Enforcement
        # job can compute 'Requirements Tested: N/T (xx%)' across all matrix runs.
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: traceability-unit-${{ matrix.os }}-${{ matrix.config }}
          # Current run only (logs/ is gitignored); test-evidence/ holds COMMITTED historical summaries.
          path: logs/traceability-summary-*.md
          if-no-files-found: ignore

      - name: Report test status
        if: matrix.hardware != true
        shell: bash
        run: |
          echo "Test Status Report"
          echo "   OS: ${{ matrix.os }}"
          echo "   Configuration: ${{ matrix.config }}"
          echo "   Build System: ${{ env.BUILD_SYSTEM }}"
          echo ""
          echo "Code coverage target: >=${{ env.MIN_TEST_COVERAGE }}%"

  traceability-coverage:
    name: Traceability Coverage Enforcement
    # Wait for both unit-tests AND integration-tests so ALL traceability-summary
    # artifacts are available before computing 'Requirements Tested: N/T (xx%)'.
    # This includes: GitHub-hosted (Debug+Release), self-hosted hardware (Debug+Release)
    # for both HardwareUnit and HardwareIntegration suites.
    needs: [github-issues-generation, unit-tests, integration-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install pyyaml
      - name: Download traceability artifact
        uses: actions/download-artifact@v4
        with:
          name: spec-generated-artifacts
          path: .
      - name: Enforce requirement linkage coverage
        # Checks GitHub issue links: what % of REQ-* issues have a TEST issue linked.
        # Source: build/traceability.json (generated by spec-generation job).
        run: |
          python scripts/validate-trace-coverage.py \
            --min-req ${{ env.MIN_REQ_LINKAGE_COVERAGE }} \
            --min-req-test ${{ env.MIN_REQ_TEST_COVERAGE }}

      - name: Download test execution traceability artifacts (unit tests)
        # Collect summaries from ALL unit-test matrix runs:
        # GitHub-hosted (windows-latest + windows-2022, Debug + Release)
        # and self-hosted hardware runner (Debug + Release, -Suite HardwareUnit).
        # NOTE: merge-multiple intentionally omitted — all artifacts have the same
        # filename (traceability-summary-YYYYMMDD.md); merge-multiple:true would
        # cause last-write-wins overwrite. Each artifact keeps its own sub-folder
        # so rglob() in the Python step finds all files independently.
        uses: actions/download-artifact@v4
        with:
          pattern: traceability-unit-*
          path: test-traceability
        continue-on-error: true

      - name: Download test execution traceability artifacts (integration tests)
        # Collect summaries from ALL integration-test matrix runs:
        # GitHub-hosted (windows-latest + windows-2022, Debug + Release)
        # and self-hosted hardware runner (Debug + Release, -Suite HardwareIntegration).
        # Requirements that appear in both unit and integration artifacts are deduplicated
        # by req number — each requirement is counted once (worst-case pass/fail/skip).
        # NOTE: merge-multiple intentionally omitted — see unit tests step above.
        uses: actions/download-artifact@v4
        with:
          pattern: traceability-integration-*
          path: test-traceability
        continue-on-error: true

      - name: Enforce test execution coverage
        # Parses 'Verifies: #N' data that test files emit to their logs.
        # Reports 'Requirements Tested: N/T (xx%)' from actual CI run outcomes.
        # Source of truth: each test file's printf("  Verifies: #N ...") statements.
        # SKIP is shown explicitly — never assumed pass or fail.
        # Note: the same requirement may appear in multiple matrix runs (Debug+Release,
        # unit+integration). Counts are accumulated; n_tested = len(unique req numbers),
        # so each requirement is counted once regardless of how many configs tested it.
        # Note: "Hardware Test Evidence (local run, committed XML)" job is NOT included
        # here — it publishes committed XML via dorny/test-reporter for UI display only
        # and does not upload a traceability-unit-* or traceability-integration-* artifact.
        # The self-hosted hardware runner fresh runs DO contribute via those artifacts.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PYTHON_SCRIPT'
          import re, sys, json
          from pathlib import Path

          summaries = list(Path('test-traceability').rglob('traceability-summary-*.md'))
          if not summaries:
              print('No test execution traceability artifacts found.')
              print('This is expected on runs without a self-hosted hardware runner.')
              sys.exit(0)

          # Parse matrix rows: | [#N](url) | suite | test-issue-col | PASS | FAIL | SKIP |
          # Columns: req=#N, suite=name, test_issue=[#M](url) or —, pass/fail/skip=int
          row_re   = re.compile(r'^\| \[#(\d+)\]\([^)]+\) \| ([^|]+) \| ([^|]*) \| (\d+) \| (\d+) \| (\d+) \|')
          issue_re = re.compile(r'#(\d+)')

          tested      = {}   # req_num -> {pass, fail, skip}
          test_issues = set()  # TEST-issue numbers from the "Test Issue" column (Implements: #N)

          for md in summaries:
              in_table = False
              for line in md.read_text(encoding='utf-8').splitlines():
                  if '| Requirement |' in line:
                      in_table = True
                      continue
                  if in_table:
                      m = row_re.match(line)
                      if m:
                          req     = m.group(1)
                          ti_col  = m.group(3)
                          p, f, s = int(m.group(4)), int(m.group(5)), int(m.group(6))
                          if req not in tested:
                              tested[req] = {'pass': 0, 'fail': 0, 'skip': 0}
                          tested[req]['pass'] += p
                          tested[req]['fail'] += f
                          tested[req]['skip'] += s
                          for ti in issue_re.findall(ti_col):
                              test_issues.add(ti)
                      elif line.startswith('###') or not line.strip():
                          in_table = False

          # Load total REQ count from traceability.json if available
          total_reqs = 0
          trace_json = Path('build/traceability.json')
          if trace_json.exists():
              data = json.loads(trace_json.read_text(encoding='utf-8'))
              for key in ('requirement', 'REQ', 'REQ-'):
                  m2 = data.get('metrics', {}).get(key, {})
                  if isinstance(m2, dict) and (m2.get('total') or m2.get('count')):
                      total_reqs = m2.get('total') or m2.get('count')
                      break

          n_tested     = len(tested)
          # Pass (pure): all outcomes are passes (no skips, no fails)
          n_pass_pure  = sum(1 for v in tested.values() if v['pass'] > 0 and v['skip'] == 0 and v['fail'] == 0)
          # Pass+Skip: at least one pass, at least one skip, no fails
          # (e.g. multi-adapter test where some adapters pass and some skip sub-cases)
          n_pass_skip  = sum(1 for v in tested.values() if v['pass'] > 0 and v['skip'] > 0  and v['fail'] == 0)
          n_fail       = sum(1 for v in tested.values() if v['fail'] > 0)
          # Skip-only: no passes, no fails — all test cases for this req were skipped
          n_skip_only  = sum(1 for v in tested.values() if v['pass'] == 0 and v['fail'] == 0)

          if total_reqs:
              pct = n_tested / total_reqs * 100
              print(f'Requirements Tested: {n_tested}/{total_reqs} ({pct:.0f}%)')
          else:
              print(f'Requirements with test outcomes: {n_tested} (total REQ count unavailable)')
          print(f'  Pass: {n_pass_pure}  |  Pass+Skip: {n_pass_skip}  |  Fail: {n_fail}  |  Skip-only: {n_skip_only}')
          print(f'  (Pass = all PASS; Pass+Skip = PASS present, some sub-cases skipped; Skip-only = no PASS evidence)')
          print(f'  Source: traceability-unit-* + traceability-integration-* CI artifacts only.')
          print(f'  Note: committed test-evidence/hardware-results-latest.xml is NOT counted here.')

          n_test_issues = len(test_issues)

          # Query GitHub for total test-case issues (denominator for percentage)
          import os, urllib.request
          total_test_issues = 0
          gh_token = os.environ.get('GITHUB_TOKEN', '')
          gh_repo  = os.environ.get('GITHUB_REPOSITORY', 'zarfld/IntelAvbFilter')
          if gh_token:
              try:
                  api_url = (f'https://api.github.com/repos/{gh_repo}/issues'
                             '?labels=type%3Atest-case&state=all&per_page=100')
                  all_count = 0
                  while api_url:
                      req_obj = urllib.request.Request(api_url, headers={
                          'Authorization': f'token {gh_token}',
                          'Accept': 'application/vnd.github+json',
                          'User-Agent': 'ci-coverage-check',
                      })
                      with urllib.request.urlopen(req_obj, timeout=30) as resp:
                          page_data = json.loads(resp.read().decode())
                          all_count += len(page_data)
                          link_hdr = resp.headers.get('Link', '')
                          api_url = None
                          for part in link_hdr.split(','):
                              if 'rel="next"' in part:
                                  api_url = part.split(';')[0].strip().strip('<>')
                                  break
                  total_test_issues = all_count
              except Exception as e:
                  print(f'  (could not fetch test-case issue count: {e})')

          if n_test_issues:
              if total_test_issues:
                  ti_pct = n_test_issues / total_test_issues * 100
                  print(f'Test Issues Tested (Implements: #N): {n_test_issues}/{total_test_issues} ({ti_pct:.0f}%) unique TEST-* issues exercised in CI')
              else:
                  print(f'Test Issues Tested (Implements: #N): {n_test_issues} unique TEST-* issues exercised in CI (denominator unavailable)')
          else:
              print('Test Issues Tested: 0 (no Implements: #N links in traceability table — add them to test main())')

          if n_fail:
              fail_list = sorted([r for r, v in tested.items() if v['fail'] > 0], key=int)
              print(f'  Failing requirements: {chr(35)+chr(44).join(fail_list)}')

          min_pct = int('${{ env.MIN_REQ_TEST_COVERAGE }}')
          if min_pct > 0 and total_reqs and pct < min_pct:
              print(f'FAIL: {pct:.0f}% < required {min_pct}%', file=sys.stderr)
              sys.exit(1)
          PYTHON_SCRIPT

  integrity-scan:
    name: Integrity Level Scan
    needs: [github-issues-generation]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download integrity scan artifact
        uses: actions/download-artifact@v4
        with:
          name: spec-generated-artifacts
          path: .
      - name: Display integrity scan results
        run: |
          if [ -f build/integrity-scan.json ]; then
            echo "🔍 Integrity Level Scan Results:"
            cat build/integrity-scan.json | python -m json.tool
            
            # Extract and display high-integrity items
            python - <<'PYTHON_SCRIPT'
          import json
          from pathlib import Path

          data = json.loads(Path('build/integrity-scan.json').read_text())

          if data.get('highIntegrity'):
              print(f"\n⚠️ High-integrity requirements found: {len(data.get('files', []))}")
              print("These require additional scrutiny:")
              for item in data.get('files', []):
                  print(f"  - {item.get('path')} (Level {item.get('level')})")
                  if 'title' in item:
                      print(f"    Issue #{item.get('issue')}: {item.get('title')}")
          else:
              print("\n✅ No high-integrity (P0/P1) requirements found")
          PYTHON_SCRIPT
          else
            echo "⚠️ integrity-scan.json not found"
          fi

  # Phase 06: Integration Testing
  integration-tests:
    name: Integration Tests (${{ matrix.os }}, ${{ matrix.config }})
    runs-on: ${{ matrix.os }}
    needs: [unit-tests]
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
        config: [Debug, Release]
        hardware: [false]
        # GitHub-hosted only.  Physical HIL: .github/workflows/hil.yml.

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Setup Python
        # Skip on self-hosted hardware runners — Python is already installed there.
        # actions/setup-python tries to download/install Python which fails on these
        # machines due to PowerShell execution policy restrictions.
        if: matrix.hardware != true
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CMake and Build Tools (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build

      - name: Install CMake and Build Tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja

      - name: Install CMake and Build Tools (Windows)
        if: runner.os == 'Windows' && matrix.hardware != true
        uses: ilammy/msvc-dev-cmd@v1

      - name: Detect integration test configuration
        if: matrix.hardware != true
        shell: bash
        run: |
          echo "🔍 Detecting integration test setup..."

          if [ -d "test/integration" ] || [ -d "tests/integration" ]; then
            echo "INTEGRATION_DIR=$(find . -type d -name integration | head -1)" >> $GITHUB_ENV
            echo "✅ Integration test directory found"
          elif [ -d "test" ] && (find test -name "*integration*" -type f | grep -q .); then
            echo "INTEGRATION_DIR=test" >> $GITHUB_ENV
            echo "✅ Integration tests found in test directory"
          else
            echo "INTEGRATION_DIR=none" >> $GITHUB_ENV
            echo "⚠️ No dedicated integration tests found"
          fi

      - name: Build and run integration tests (CMake)
        if: env.INTEGRATION_DIR != 'none' && runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f "${{ env.INTEGRATION_DIR }}/CMakeLists.txt" ]; then
            cd "${{ env.INTEGRATION_DIR }}"
            
            echo "🏗️ Building integration tests (${{ matrix.config }})..."
            cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -G Ninja
            cmake --build build --config ${{ matrix.config }}
            
            echo "🔗 Running integration tests..."
            ctest --test-dir build -C ${{ matrix.config }} --output-on-failure -L integration || {
              echo "⚠️ Integration tests completed with warnings"
            }
          else
            echo "⚠️ No CMake configuration for integration tests"
          fi

      - name: Install Windows Driver Kit (WDK)
        # Skip on self-hosted hardware runners — WDK is already installed there.
        # Attempting to install/modify WDK on a developer machine risks corrupting
        # the existing build environment. No installations on self-hosted runners.
        if: runner.os == 'Windows' && matrix.hardware != true
        uses: ./.github/actions/install-wdk

      - name: Install test build dependencies (Windows)
        # Skip on self-hosted hardware runners — Npcap SDK and WDK headers must
        # already be present. No downloads or installations on self-hosted runners.
        if: runner.os == 'Windows' && matrix.hardware != true
        shell: pwsh
        run: |
          ## 1. Npcap SDK (required by test_tx_timestamp_retrieval)
          $npcapDest = 'C:\npcap-sdk-1.16'
          if (Test-Path (Join-Path $npcapDest 'Include\pcap.h')) {
            Write-Host " Npcap SDK already present" -ForegroundColor Green
          } else {
            Write-Host " Downloading Npcap SDK 1.16..." -ForegroundColor Cyan
            Invoke-WebRequest -Uri 'https://npcap.com/dist/npcap-sdk-1.16.zip' -OutFile 'C:\npcap-sdk.zip' -UseBasicParsing
            New-Item -ItemType Directory -Path $npcapDest -Force | Out-Null
            Expand-Archive -Path 'C:\npcap-sdk.zip' -DestinationPath $npcapDest -Force
            Remove-Item 'C:\npcap-sdk.zip' -Force
            if (Test-Path (Join-Path $npcapDest 'Include\pcap.h')) {
              Write-Host " Npcap SDK installed at $npcapDest" -ForegroundColor Green
            } else {
              Write-Host " Npcap SDK install unexpected structure; listing:" -ForegroundColor Red
              Get-ChildItem $npcapDest -Recurse | Select-Object -First 20 | Format-Table FullName
            }
          }

          ## 2. TAEF / WEX development headers (required by taef_tests)
          $taefInc = "${env:ProgramFiles(x86)}\Windows Kits\10\Testing\Development\inc"
          $taefLib = "${env:ProgramFiles(x86)}\Windows Kits\10\Testing\Development\lib\x64"
          if ((Test-Path "$taefInc\WexTestClass.h") -and (Test-Path "$taefLib\Wex.Common.lib")) {
            Write-Host " TAEF development headers found in WDK" -ForegroundColor Green
            "TAEF_INCLUDE=$taefInc" >> $env:GITHUB_ENV
            "TAEF_LIB=$taefLib" >> $env:GITHUB_ENV
          } else {
            Write-Host " TAEF headers not at standard WDK path; searching Windows Kits..." -ForegroundColor Yellow
            $found = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits" -Recurse -Filter 'WexTestClass.h' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              $taefInc = $found.DirectoryName
              Write-Host " Found WexTestClass.h at $taefInc" -ForegroundColor Green
              "TAEF_INCLUDE=$taefInc" >> $env:GITHUB_ENV
              $taefLib = Join-Path (Split-Path $taefInc -Parent) 'lib\x64'
              if (-not (Test-Path "$taefLib\Wex.Common.lib")) { $taefLib = $taefInc }
              "TAEF_LIB=$taefLib" >> $env:GITHUB_ENV
            } else {
              Write-Host " TAEF/WEX headers not found in WDK installation" -ForegroundColor Yellow
              Write-Host "   taef_tests will be skipped (WDK installed without TAEF Testing component)" -ForegroundColor Gray
            }
          }

      - name: Build Windows integration tests (Windows)
        if: runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          Write-Host " Building Windows integration test executables (${{ matrix.config }})..." -ForegroundColor Cyan
          .\tools\build\Build-Tests.ps1 -Configuration ${{ matrix.config }}
          Write-Host " Integration test build complete" -ForegroundColor Green

      - name: Run Windows integration tests (hardware-independent subset)
        if: runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          # GitHub runner is already Administrator — call Run-Tests-CI.ps1 directly.
          .\tools\test\Run-Tests-CI.ps1 -Configuration ${{ matrix.config }} -Suite Integration

      - name: Hardware-dependent integration tests (Windows, skipped — no Intel NIC on runner)
        if: runner.os == 'Windows' && matrix.hardware == false
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          Write-Host "[INFO] Hardware-dependent integration tests (avb_test_i226, avb_test_i210, "
          Write-Host "       comprehensive_ioctl_test, hw_timestamping_control_test, rx_timestamping_test)"
          Write-Host "       require a supported Intel NIC -- NOT run on CI runners."

      - name: Mark workspace safe for git (self-hosted ownership fix)
        # Fix: dorny/test-reporter runs git ls-files; on self-hosted runners the
        # workspace is owned by NETWORK SERVICE but the job runs as SYSTEM, causing
        # git to refuse the repo. Adding safe.directory resolves exit code 128.
        if: always() && runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: git config --global --add safe.directory "${{ github.workspace }}"

      - name: Publish integration test results (JUnit)
        # Surfaces JUnit XML generated by Run-Tests-CI.ps1 → Convert-Logs-To-JUnit.ps1.
        # Paths are scoped to Integration and HardwareIntegration suites only so
        # HardwareMandatory XML left by the HIL Gate job is never picked up here.
        if: always() && runner.os == 'Windows'
        uses: dorny/test-reporter@v2
        with:
          name: 'Integration Tests (${{ matrix.os }}, ${{ matrix.config }})'
          # Comma-separated (a multi-line value is one pattern for test-reporter; see the Unit step).
          path: 'logs/junit-Integration-${{ matrix.config }}-*.xml,logs/junit-HardwareIntegration-${{ matrix.config }}-*.xml'
          reporter: java-junit
          fail-on-empty: 'false'
          path-replace-backslashes: 'true'

      - name: Publish traceability summary
        # Append the GitHub-issue traceability table generated by Convert-Logs-To-JUnit.ps1
        # to the Actions job summary, so test results link back to GitHub issues.
        if: always() && runner.os == 'Windows'
        shell: 'powershell -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          $mdFile = Get-ChildItem 'logs' -Filter 'traceability-summary-*.md' -ErrorAction SilentlyContinue |
                    Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if ($mdFile) {
              Get-Content $mdFile.FullName -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
              Write-Host "[OK] Traceability summary appended to job summary" -ForegroundColor Green
          } else {
              Write-Host "[INFO] No traceability summary found in logs/" -ForegroundColor Yellow
          }

      - name: Upload traceability summary artifact
        # Upload execution traceability summary so Traceability Coverage Enforcement
        # can aggregate 'Requirements Tested' across ALL matrix runs (unit + integration,
        # GitHub-hosted + self-hosted, Debug + Release).
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: traceability-integration-${{ matrix.os }}-${{ matrix.config }}
          # Current run only (logs/ is gitignored); never the committed test-evidence/ summaries.
          path: logs/traceability-summary-*.md
          if-no-files-found: ignore

      - name: Validate integration test status
        if: matrix.hardware != true
        shell: bash
        run: |
          echo "📊 Integration Test Status"
          echo "   OS: ${{ matrix.os }}"
          echo "   Configuration: ${{ matrix.config }}"
          echo "   Test Directory: ${{ env.INTEGRATION_DIR }}"
          echo ""

          if [ "${{ env.INTEGRATION_DIR }}" = "none" ] && [ "${{ matrix.os }}" != "windows-latest" ]; then
            echo "⚠️ No integration tests detected"
            echo "   Standard location: test/integration/ or tests/integration/"
            echo "   Label integration tests with: set_tests_properties(test_name PROPERTIES LABELS integration)"
          else
            echo "✅ Integration test framework validated"
          fi

  # Phase 02: Requirements Traceability Check (GitHub Issues)
  requirements-traceability:
    needs: [spec-validation]
    name: Requirements Traceability (ISO/IEC/IEEE 29148 via GitHub Issues)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install traceability tools
        run: |
          pip install pyyaml markdown PyGithub requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for unlinked requirements
        run: |
          echo "🔍 Checking for requirements without test issues..."
          mkdir -p reports
          python scripts/trace_unlinked_requirements.py 2>&1 | tee reports/unlinked-requirements.log || {
            echo "⚠️ Script execution status: needs GitHub Issues populated"
            echo "See reports/unlinked-requirements.log for details"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Check for orphan artifacts
        run: |
          echo "🔍 Checking for orphan code/tests without issue links..."
          python scripts/github-orphan-check.py 2>&1 | tee reports/orphan-check.log || {
            echo "⚠️ Script execution status: baseline check complete"
            echo "See reports/orphan-check.log for details"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate GitHub Issues traceability report
        run: |
          echo "📊 Generating GitHub Issues traceability report..."
          mkdir -p reports
          python scripts/github-traceability-report.py 2>&1 | tee reports/github-traceability.md || {
            echo "⚠️ Report generation complete with warnings"
          }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Validate traceability chains
        run: |
          echo "✅ Validating complete traceability chains (StR→REQ→CODE→TEST)..."
          if [ -f "scripts/validate-traceability.py" ]; then
            python scripts/validate-traceability.py 2>&1 | tee reports/traceability-validation.log || {
              echo "⚠️ Validation complete - see reports/traceability-validation.log"
            }
          else
            echo "⚠️ validate-traceability.py not found, using github-traceability-report.py"
            python scripts/github-traceability-report.py 2>&1 | tee reports/traceability-summary.txt || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Upload traceability reports
        uses: actions/upload-artifact@v6
        with:
          name: traceability-reports
          path: reports/

  # Phase 07: Verification & Validation (IEEE 1012)
  acceptance-tests:
    name: Acceptance Tests (XP - Customer Tests, IEEE 1012)
    runs-on: ubuntu-latest
    needs: [integration-tests]
    permissions:
      contents: read
      issues: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install PyGithub requests pyyaml

      - name: Query and validate acceptance criteria from GitHub Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PYTHON_SCRIPT'
          import os
          from github import Github

          g = Github(os.environ['GITHUB_TOKEN'])
          repo = g.get_repo("${{ github.repository }}")

          print("🎭 Acceptance Criteria Validation Status\n")

          # Query all issues with type:test-case label
          test_issues = repo.get_issues(labels=["type:test-case"], state="all")
          test_count = sum(1 for _ in test_issues)

          # Query all functional/non-functional requirements
          req_issues = list(repo.get_issues(labels=["functional-requirement"], state="all"))
          req_issues.extend(repo.get_issues(labels=["non-functional"], state="all"))

          print(f"📊 Requirements Status:")
          print(f"   - Total Requirements: {len(req_issues)}")
          print(f"   - Test Cases: {test_count}")
          print(f"   - Traceability: {'✅ Complete' if test_count > 0 else '⚠️ Needs setup'}\n")

          # Validate traceability
          validated_count = 0
          for issue in req_issues:
              if "verified by" in issue.body.lower() or "test" in issue.body.lower():
                  validated_count += 1
                  print(f"✅ #{issue.number}: {issue.title}")
              else:
                  print(f"⚠️ #{issue.number}: {issue.title} (no test link)")

          if len(req_issues) == 0:
              print("\n⚠️ No GitHub Issues found. Please create issues using:")
              print("   .github/ISSUE_TEMPLATE/ templates")
              print("   See: docs/QUICK-START-github-issues.md")
          else:
              coverage = (validated_count / len(req_issues) * 100) if len(req_issues) > 0 else 0
              print(f"\n📈 Validation Coverage: {coverage:.1f}% ({validated_count}/{len(req_issues)})")
          PYTHON_SCRIPT
        continue-on-error: true

  # Phase 03: Architecture Compliance (ISO/IEC/IEEE 42010)
  architecture-validation:
    needs: [spec-validation]
    name: Architecture Compliance (ISO/IEC/IEEE 42010)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: ADR Impact Scan
        run: |
          ALLOW_EMPTY_SPECS=1 python scripts/adr_impact_scan.py --warn-only || echo "ADR impact scan completed"

      - name: Validate Architecture Decision Records
        run: |
          echo "📐 Validating ADR completeness..."
          for adr in 03-architecture/decisions/*.md; do
            [ -f "$adr" ] || continue
            echo "Checking $adr..."
            grep -q "## Status" "$adr" || { echo "❌ Missing Status section in $adr"; exit 1; }
            grep -q "## Context" "$adr" || { echo "❌ Missing Context section in $adr"; exit 1; }
            grep -q "## Decision" "$adr" || { echo "❌ Missing Decision section in $adr"; exit 1; }
            grep -q "## Consequences" "$adr" || { echo "❌ Missing Consequences section in $adr"; exit 1; }
          done
      - name: Validate architecture views
        run: |
          echo "🏗️ Checking required architecture views..."
          REQUIRED_VIEWS=(logical process development physical data)
          for view in "${REQUIRED_VIEWS[@]}"; do
            if [ ! -d "03-architecture/views/$view" ]; then
              echo "⚠️ Missing architecture view: $view"
            fi
          done
      - name: Verify quality attribute scenarios
        run: |
          echo "🔎 Checking quality attribute scenarios coverage..."
          FILE=03-architecture/architecture-quality-scenarios.md
          if [ ! -f "$FILE" ]; then
            echo "❌ Missing quality attribute scenarios file"; exit 1; fi
          for attr in Performance Availability Security; do
            grep -qi "$attr" "$FILE" || { echo "❌ Missing scenario for $attr"; exit 1; }
          done
          echo "✅ Basic QA scenario coverage present"

  # Security Scanning
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check for sensitive data
        run: |
          echo "🔒 Scanning for sensitive data..."
          ! grep -r "password\|secret\|api_key\|token" src/ --include="*.cpp" --include="*.h" || {
            echo "⚠️ Potential sensitive data found in source"
          }
          echo "✅ Security scan complete"
        continue-on-error: true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
        continue-on-error: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
        continue-on-error: true

  # =========================================================================
  # Hardware-in-the-Loop Mandatory Gate
  # =========================================================================
  # Runs on every supported self-hosted runner type (one job per NIC label).
  # continue-on-error: false — failures block the CI gate.
  # Tests: safe, non-mutating; driver loss = FAIL (#328 sentinel).
  # test_tx_timestamp_provenance Section H: V1/V2 ABI canary, FastIo/IRP,
  #   cross-handle isolation, masquerade, unavailability — all FAIL on error.
  # Exit code 2 (SKIP_ONLY) is treated as FAIL on the HIL runner because
  #   Section H MUST exercise the real driver.
  #
  # Runner labels follow the pattern [self-hosted, Windows, <nic>].
  # Add runners for i217/i219/i210/i225 to the matrix once those machines
  # are registered as self-hosted runners.
  # - HIL already done in unittest and integration test matrixes! - as runner does NOT install driver the SHA test could have never been passed - so thwas obsolete!

  # Standards Compliance Summary Report
  compliance-report:
    needs:
      [
        spec-validation,
        code-quality,
        unit-tests,
        integration-tests,
        requirements-traceability,
        acceptance-tests,
        architecture-validation,
        security-scan,
  #      hardware-mandatory-gate,
      ]
    name: Generate Standards Compliance Report
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      # Every status is the result of a required job of THIS run for THIS commit (Q 2026-10-29, TEST-VERDICT-014):
      # nothing is hard-coded as passed; skipped/cancelled/missing results are reported as such and are never a pass.
      # Generating the report is separate from the compliance verdict; the final step fails the job on NOT COMPLIANT.
      - name: Generate compliance report
        env:
          R_SPEC_VALIDATION: ${{ needs.spec-validation.result }}
          R_CODE_QUALITY: ${{ needs.code-quality.result }}
          R_UNIT_TESTS: ${{ needs.unit-tests.result }}
          R_INTEGRATION_TESTS: ${{ needs.integration-tests.result }}
          R_REQUIREMENTS_TRACEABILITY: ${{ needs.requirements-traceability.result }}
          R_ACCEPTANCE_TESTS: ${{ needs.acceptance-tests.result }}
          R_ARCHITECTURE_VALIDATION: ${{ needs.architecture-validation.result }}
          R_SECURITY_SCAN: ${{ needs.security-scan.result }}
        run: |
          set -euo pipefail
          label() {
            case "$1" in
              success)   echo "PASSED" ;;
              failure)   echo "FAILED" ;;
              cancelled) echo "CANCELLED (not a pass)" ;;
              skipped)   echo "NOT EXECUTED (skipped, not a pass)" ;;
              "")        echo "UNAVAILABLE (no result, not a pass)" ;;
              *)         echo "UNAVAILABLE ($1, not a pass)" ;;
            esac
          }
          gates="spec-validation|R_SPEC_VALIDATION|Specification validation
          code-quality|R_CODE_QUALITY|Code quality (IEEE 1016, XP practices)
          unit-tests|R_UNIT_TESTS|Unit tests (IEEE 1012)
          integration-tests|R_INTEGRATION_TESTS|Integration tests (IEEE 1012)
          acceptance-tests|R_ACCEPTANCE_TESTS|Acceptance tests (IEEE 1012)
          requirements-traceability|R_REQUIREMENTS_TRACEABILITY|Requirements traceability (ISO/IEC/IEEE 29148)
          architecture-validation|R_ARCHITECTURE_VALIDATION|Architecture compliance (ISO/IEC/IEEE 42010)
          security-scan|R_SECURITY_SCAN|Security scan"
          notpassed=""
          rows=""
          while IFS='|' read -r job var title; do
            job="$(echo "$job" | tr -d '[:space:]')"
            res="${!var:-}"
            rows="${rows}| ${title} | \`${job}\` | $(label "$res") |"$'\n'
            if [ "$res" != "success" ]; then notpassed="${notpassed} ${job}"; fi
          done <<< "$gates"
          {
            echo "# Standards Compliance Report"
            echo ""
            echo "- Generated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Workflow run: ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo ""
            echo "Each status is the result of a required job of this run for this commit. A skipped, cancelled or missing job is not a pass."
            echo "Test-level verdicts (FAILED, BLOCKED, INCONCLUSIVE, SKIPPED cases) are in the JUnit reports of the test jobs; they are not summarized here."
            echo ""
            echo "| Required gate | Job | Result |"
            echo "|---|---|---|"
            printf '%s' "$rows"
            echo ""
            if [ -z "$notpassed" ]; then
              echo "## Compliance verdict: COMPLIANT - every required gate passed"
            else
              echo "## Compliance verdict: NOT COMPLIANT - not passed:${notpassed}"
            fi
            echo ""
            echo "Generating this report is independent of the verdict; the job fails in its final step when the verdict is NOT COMPLIANT."
          } > compliance-report.md
          printf '%s\n' "${notpassed# }" > noncompliant-gates.txt
          cat compliance-report.md

      # Published without a write token (TEST-VERDICT-013): the former PR comment (issues.createComment) failed with
      # HTTP 403 under the read-only default token (run 40840781230); no requirement mandates a PR comment.  The job
      # summary shows the report on every run, the artifact keeps it (README links it); a missing report fails the job.
      - name: Publish compliance report to the job summary
        run: cat compliance-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compliance report
        uses: actions/upload-artifact@v6
        with:
          name: compliance-report
          path: compliance-report.md
          if-no-files-found: error

      - name: Fail when a required gate did not pass
        run: |
          gates="$(tr -d '\r\n' < noncompliant-gates.txt)"
          if [ -n "$gates" ]; then
            echo "::error::Standards compliance NOT COMPLIANT - required gates not passed: ${gates}"
            exit 1
          fi
          echo "Standards compliance: COMPLIANT - every required gate passed"

  # Deployment (Phase 08) - only on master branch
  deploy-staging:
    # hil.yml authorize requires exactly one successful job per configuration with exactly this name.
    name: Deploy to Staging (Phase 08 - Transition) (${{ matrix.config }})
    runs-on: windows-latest
    needs:
      [
        code-quality,
        unit-tests,
        integration-tests,
        acceptance-tests,
        security-scan,
      ]
    # Master pushes and v* tags (post-merge confirmation / release) and same-repository OWNER pull requests into master
    # (the mandatory pre-merge HIL candidate; owner requirement 2026-10-30).  Fork and non-OWNER PRs are never staged.
    if: |
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'pull_request' &&
       github.base_ref == 'master' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.author_association == 'OWNER')
    permissions:
      contents: write
    # One signed, separately identified package per configuration (hil.yml deploys and tests both).
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - name: Checkout the candidate revision
        # On pull_request GITHUB_SHA is the synthetic refs/pull/N/merge commit; the candidate HIL tests (and the merge
        # lands) is the PR HEAD commit, so exactly that commit is built, stamped and handed to hil.yml.
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          submodules: recursive

      - name: Verify the checked-out candidate revision
        id: staged-revision
        shell: pwsh
        env:
          AVB_EXPECTED_STAGED_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          $head = ([string](git rev-parse HEAD)).Trim()
          if ($env:AVB_EXPECTED_STAGED_REVISION -cnotmatch '^[0-9a-f]{40}$' -or $head -cne $env:AVB_EXPECTED_STAGED_REVISION) {
            Write-Host "::error title=Staged revision::checked-out HEAD '$head' is not the candidate revision '$env:AVB_EXPECTED_STAGED_REVISION'"
            exit 1
          }
          "AVB_STAGED_REVISION=$head" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Staging candidate revision $head ($env:GITHUB_EVENT_NAME)"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Windows Driver Kit (WDK)
        uses: ./.github/actions/install-wdk

      - name: Build and sign the driver package with the stable HIL signer
        # The controlled test-signing identity (repository secrets; never available to pull requests or forks).
        # Without it there is no deployable package: staging fails loudly instead of using an ephemeral signer
        # the HIL machine does not trust.
        shell: pwsh
        env:
          AVB_SIGNING_PFX_BASE64: ${{ secrets.HIL_TEST_SIGNING_PFX_BASE64 }}
          AVB_SIGNING_PFX_PASSWORD: ${{ secrets.HIL_TEST_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:AVB_SIGNING_PFX_BASE64 -or -not $env:AVB_SIGNING_PFX_PASSWORD) {
            Write-Host "::error title=Stable signer not configured::secrets HIL_TEST_SIGNING_PFX_BASE64 / HIL_TEST_SIGNING_PFX_PASSWORD are required (tools/ci/signing/README.md)"
            exit 1
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'hil-signer.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:AVB_SIGNING_PFX_BASE64))
            .\tools\build\Build-Driver.ps1 -Configuration ${{ matrix.config }} -SigningPfx $pfx
            $rc = $LASTEXITCODE
          } finally { Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue }
          exit $rc

      - name: Create and self-check the package manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\tools\lib\DriverPackage.ps1
          $pkg = "build\x64\${{ matrix.config }}\IntelAvbFilter\IntelAvbFilter"
          $m = New-AvbDriverPackageManifest -PackageDir $pkg -Configuration '${{ matrix.config }}' -SourceRevision $env:AVB_STAGED_REVISION `
                   -Repository $env:GITHUB_REPOSITORY -Workflow '.github/workflows/ci-standards-compliance.yml' -RunId $env:GITHUB_RUN_ID -RunAttempt $env:GITHUB_RUN_ATTEMPT
          $pin = Get-AvbPinnedSigner -CertificatePath 'tools\ci\signing\hil-test-signer.cer'
          if (-not $pin.Ok) { Write-Host "::error title=Pinned signer::$($pin.Error)"; exit 1 }
          # Trust is not evaluated here (the hosted builder does not trust the test root); the HIL machine does.
          $v = Test-AvbDriverPackage -PackageDir $pkg -Configuration '${{ matrix.config }}' -ExpectedRevision $env:AVB_STAGED_REVISION -ExpectedRepository $env:GITHUB_REPOSITORY `
                   -ExpectedRunId $env:GITHUB_RUN_ID -ExpectedRunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedDriverSha256 $m.driverSha256 -PinnedThumbprint $pin.Thumbprint
          if (-not $v.Ok) { Write-Host "::error title=Package self-check failed::$($v.Reasons -join '; ')"; exit 1 }
          Write-Host "Package ${{ matrix.config }}: driver $($m.driverSha256), signer $($m.signer.catThumbprint)"
          "## Staged driver package ${{ matrix.config }}`n`n- driver SHA256: $($m.driverSha256)`n- signer: $($m.signer.subject) ($($m.signer.catThumbprint))`n- revision: $env:AVB_STAGED_REVISION (run $env:GITHUB_RUN_ID attempt $env:GITHUB_RUN_ATTEMPT)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload the staged driver package
        # Exactly the package (inf/sys/cat/man) + avb-driver-package.json; hil.yml verifies it file by file.
        uses: actions/upload-artifact@v6
        with:
          name: intel-avb-filter-driver-${{ matrix.config == 'Debug' && 'debug' || 'release' }}
          path: build\x64\${{ matrix.config }}\IntelAvbFilter\IntelAvbFilter\
          if-no-files-found: error
          retention-days: 90

      - name: Package driver for release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.config == 'Release'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zipName = "IntelAvbFilter-$tag.zip"
          $buildRoot  = "build\x64\Release\IntelAvbFilter"
          $wdkPkgDir  = Join-Path $buildRoot "IntelAvbFilter"   # WDK package: .cat .inf .sys .man

          # Collect only the installable driver files into a flat staging dir
          $staging = New-Item -ItemType Directory -Path "release-staging" -Force
          # WDK package files (includes the .cat required by pnputil)
          Get-ChildItem $wdkPkgDir -File | Copy-Item -Destination $staging
          # Public certificate of the stable signer that signed this package (import into Trusted Root + Trusted
          # Publishers for the test-signed driver); the WDK-exported .cer of the build machine did not sign it.
          Copy-Item "tools\ci\signing\hil-test-signer.cer" (Join-Path $staging "IntelAvbFilter.cer")

          Write-Host "Staged files:"
          Get-ChildItem $staging | ForEach-Object { Write-Host "  $($_.Name)" }

          Compress-Archive -Path "$staging\*" -DestinationPath $zipName -Force
          $hash = (Get-FileHash $zipName -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File "$zipName.sha256" -Encoding ascii
          Write-Host "Created $zipName (SHA256: $hash)"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.config == 'Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "IntelAvbFilter ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          files: |
            IntelAvbFilter-${{ github.ref_name }}.zip
            IntelAvbFilter-${{ github.ref_name }}.zip.sha256
          body: |
            ## Intel AVB Filter Driver ${{ github.ref_name }}

            Compiled, signed Windows KMDF driver for IEEE 802.1AS / AVB hardware timestamping.

            **Supported adapters:** Intel I226, I225, I219, I210, I217

            ### Prerequisites (test-signed driver)
            This package is **test-signed**. Before installing:
            - **Disable Secure Boot** in UEFI/BIOS
            - Enable **TESTSIGNING** (Test Mode): `bcdedit /set testsigning on` (admin, then reboot)
            - Import the test certificate: double-click `IntelAvbFilter.cer` → install into **"Local Machine → Trusted Root Certification Authorities"** and **"Local Machine → Trusted Publishers"**

            ### Install (quick / GUI)
            1. Extract the ZIP
            2. Right-click `IntelAvbFilter.inf` → **Install**
            3. Open adapter properties (Network Connections → Adapter → Properties) and ensure the filter is enabled for the target adapter
            4. Reboot if requested

            ### Install (reproducible / CLI)
            Admin console in the extracted folder:

            `pnputil /add-driver .\IntelAvbFilter.inf /install`

            ### SHA256 Checksum
            See attached `.sha256` file.

      - name: Report build status
        if: always()
        shell: pwsh
        run: |
          Write-Host " Driver Build: ${{ job.status }}" -ForegroundColor Cyan
          Write-Host "Phase 08: Windows KMDF driver packaged and ready for deployment"
          $DriverFiles = Get-ChildItem -Path "build\x64\${{ matrix.config }}\IntelAvbFilter\IntelAvbFilter" -ErrorAction SilentlyContinue
          if ($DriverFiles) {
            Write-Host " Driver artifacts:"
            $DriverFiles | ForEach-Object { Write-Host "  - $($_.Name) ($([Math]::Round($_.Length/1KB, 1)) KB)" }
          }

  # Hardware Test Evidence Publication (Phase 07 evidence)
  # Tests that require an Intel NIC + installed driver are run locally and their
  # results committed to test-evidence/ as JUnit XML.  This job surfaces them in
  # the GitHub Actions test-results UI so coverage is visible without re-running
  # on the CI runner.
  # Implements: #265 (TEST-COVERAGE-001), #244 (TEST-BUILD-CI-001)
  # Traces to:  #98 (REQ-NF-BUILD-CI-001)
  hardware-test-evidence:
    # HISTORICAL committed evidence only - never a result of this run and never hardware verification
    # (that is .github/workflows/hil.yml).
    name: Hardware Test Evidence (HISTORICAL committed XML, not this run)
    runs-on: ubuntu-latest
    # Run independently of build jobs — evidence comes from committed files
    if: always()
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check evidence file exists
        id: check-evidence
        run: |
          if [ -f "test-evidence/hardware-results-latest.xml" ]; then
            echo "EVIDENCE_EXISTS=true" >> $GITHUB_ENV
            COUNT=$(grep -o '<testcase' test-evidence/hardware-results-latest.xml | wc -l)
            FAIL=$(grep -o '<failure' test-evidence/hardware-results-latest.xml | wc -l)
            DATE=$(grep -o 'Run date: [0-9]\{8\}' test-evidence/hardware-results-latest.xml | head -1 | grep -o '[0-9]\{8\}')
            echo "EVIDENCE_COUNT=$COUNT" >> $GITHUB_ENV
            echo "EVIDENCE_FAIL=$FAIL" >> $GITHUB_ENV
            echo "EVIDENCE_DATE=${DATE:-unknown}" >> $GITHUB_ENV
            echo "Found hardware test evidence: $COUNT tests ($FAIL failed), run date: ${DATE:-unknown}"
          else
            echo "EVIDENCE_EXISTS=false" >> $GITHUB_ENV
            echo "No hardware test evidence committed. Run tools/test/Convert-Logs-To-JUnit.ps1 locally."
          fi

      - name: Publish hardware test evidence
        if: env.EVIDENCE_EXISTS == 'true'
        uses: dorny/test-reporter@v2
        with:
          name: "HISTORICAL hardware evidence ${{ env.EVIDENCE_DATE }} (committed, not this run)"
          path: "test-evidence/hardware-results-latest.xml"
          reporter: java-junit
          # evidence-only: do not fail CI just because hardware tests failed
          # (hardware tests inherently require NIC + driver, cannot run on runner)
          fail-on-error: "false"

      - name: Summarize evidence
        if: always()
        run: |
          if [ "$EVIDENCE_EXISTS" = "true" ]; then
            echo "## Hardware Test Evidence" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Test cases | $EVIDENCE_COUNT |" >> $GITHUB_STEP_SUMMARY
            echo "| Failures   | $EVIDENCE_FAIL |" >> $GITHUB_STEP_SUMMARY
            echo "| Run date   | $EVIDENCE_DATE |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "> Tests require Intel I2xx NIC + installed IntelAvbFilter driver." >> $GITHUB_STEP_SUMMARY
            echo "> Evidence committed via \`tools/test/Convert-Logs-To-JUnit.ps1\`." >> $GITHUB_STEP_SUMMARY
          else
            echo "## Hardware Test Evidence" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo ":warning: No hardware test evidence committed yet." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Run locally and commit:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "# On machine with Intel NIC + driver installed:" >> $GITHUB_STEP_SUMMARY
            echo ".\tools\test\Run-Tests-Elevated.ps1" >> $GITHUB_STEP_SUMMARY
            echo ".\tools\test\Convert-Logs-To-JUnit.ps1" >> $GITHUB_STEP_SUMMARY
            echo "git add test-evidence/ ; git commit -m 'chore(evidence): update hardware test results'" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          .\tools\build\Build-Tests.ps1 -Configuration $env:HIL_CONFIGURATION
          exit $LASTEXITCODE


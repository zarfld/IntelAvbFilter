            $pend = (Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue).PendingFileRenameOperations
            if (@($pend | Where-Object { $_ -match '(?i)IntelAvbFilter' }).Count -gt 0) { $r += 'reboot-time replacement of IntelAvbFilter pending: reboot required (never automatic)' }
            foreach ($did in '125B', '1533', '15BB') {

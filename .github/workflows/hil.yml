            }
          } catch { $r += "preflight error: $($_.Exception.Message)" }
          if ($r.Count -gt 0) {
            Write-Host "::error title=HIL BLOCKED::$($r -join '; ')"
            foreach ($x in $r) { Write-Host "[HIL-PREFLIGHT] BLOCKED: $x" }
            exit 1
          }

            headRevision = ([string](git rev-parse HEAD)).Trim(); upstreamRunId = $env:HIL_UPSTREAM_RUN_ID; upstreamRunAttempt = $env:HIL_UPSTREAM_RUN_ATTEMPT
            job = $env:GITHUB_JOB; configuration = $env:HIL_CONFIGURATION; runner = $env:RUNNER_NAME

          ($id | ConvertTo-Json) | Set-Content -LiteralPath (Join-Path $dir 'hil-run-identity.json') -Encoding utf8
          Get-Content -LiteralPath (Join-Path $dir 'hil-run-identity.json')

      # Suites in the LocalSuites order, HardwareMandatory last.  Each runs whenever the deployment succeeded (a
      # failure in one suite never hides the evidence of the next); -PriorResultsDir carries a halt of an earlier
      # suite of this job (TIMEOUT / INFRA / CLEANUP_FAILED / state halt / killed run) so a damaged state never becomes
      # a clean baseline: later Init/Mutating/Unsafe tests are BLOCKED, ReadOnly tests continue.
      - name: Run HardwareUnit
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          .\tools\test\Run-Tests-CI.ps1 -Configuration $env:HIL_CONFIGURATION -Suite HardwareUnit -LogsDir (Join-Path $env:RUNNER_TEMP 'hil-evidence\HardwareUnit') -PriorResultsDir (Join-Path $env:RUNNER_TEMP 'hil-evidence')
          exit $LASTEXITCODE

      - name: Run HardwareIntegration
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          .\tools\test\Run-Tests-CI.ps1 -Configuration $env:HIL_CONFIGURATION -Suite HardwareIntegration -LogsDir (Join-Path $env:RUNNER_TEMP 'hil-evidence\HardwareIntegration') -PriorResultsDir (Join-Path $env:RUNNER_TEMP 'hil-evidence')
          exit $LASTEXITCODE

      - name: Run HardwareMutation
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          .\tools\test\Run-Tests-CI.ps1 -Configuration $env:HIL_CONFIGURATION -Suite HardwareMutation -LogsDir (Join-Path $env:RUNNER_TEMP 'hil-evidence\HardwareMutation') -PriorResultsDir (Join-Path $env:RUNNER_TEMP 'hil-evidence')
          exit $LASTEXITCODE

      - name: Run HardwareMandatory (mandatory HIL gate)
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          .\tools\test\Run-Tests-CI.ps1 -Configuration $env:HIL_CONFIGURATION -Suite HardwareMandatory -LogsDir (Join-Path $env:RUNNER_TEMP 'hil-evidence\HardwareMandatory') -PriorResultsDir (Join-Path $env:RUNNER_TEMP 'hil-evidence')
          exit $LASTEXITCODE

      - name: Machine state for the next configuration
        id: machine
        if: always()
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          $f = Join-Path $env:RUNNER_TEMP 'hil-evidence\deployment.json'
          $v = if (Test-Path -LiteralPath $f) { (Get-Content -LiteralPath $f -Raw | ConvertFrom-Json).verdict } else { 'NONE' }
          $ok = if ($v -in 'NEEDS_OPERATOR', 'NOT_EXECUTED_BUSY', 'IN_FLIGHT') { 'false' } else { 'true' }
          "machine_ok=$ok" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "deployment verdict $v -> machine_ok=$ok"

      - name: Release the HIL machine lock
        if: always()
        shell: 'powershell -NoProfile -ExecutionPolicy Bypass -NonInteractive -Command ". ''{0}''"'
        run: |
          if (-not (Test-Path -LiteralPath '.\tools\ci\Invoke-HilDeployment.ps1')) { Write-Host 'no checkout: no lock was taken'; exit 0 }
          .\tools\ci\Invoke-HilDeployment.ps1 -Action Release -EvidenceDir (Join-Path $env:RUNNER_TEMP 'hil-evidence')
          exit $LASTEXITCODE

      - name: Upload HIL evidence (this run only)
        # RUNNER_TEMP is emptied by the runner for every job: only this job's identity, deployment, logs and JUnit are here.
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hil-evidence-Release
          path: ${{ runner.temp }}/hil-evidence/
          if-no-files-found: ignore

  hil-acceptance:
    name: HIL Acceptance (current-run evidence)
    needs: [authorize, hil-debug, hil-release]
    # Runs whenever the HIL was authorized - also after a failed stage, so failures are published and judged.
    if: ${{ !cancelled() && github.repository == 'zarfld/IntelAvbFilter' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == 'zarfld/IntelAvbFilter' && ((github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master') || github.event.workflow_run.event == 'pull_request') && needs.authorize.outputs.authorized == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - name: Checkout the authorized upstream commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: 'false'

      - name: Download HIL evidence of this run
        uses: actions/download-artifact@v4
        with:
          pattern: hil-evidence-*
          path: hil-evidence

      - name: Hardware acceptance verdict (current-run evidence)
        id: verdict
        env:
          HIL_DEBUG: ${{ needs.hil-debug.result }}
          HIL_RELEASE: ${{ needs.hil-release.result }}
          HIL_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          HIL_UPSTREAM_RUN_ID: ${{ needs.authorize.outputs.upstream_run_id }}
          HIL_STAGED_DEBUG: ${{ needs.authorize.outputs.staged_debug_sha256 }}
          HIL_STAGED_RELEASE: ${{ needs.authorize.outputs.staged_release_sha256 }}
          HIL_EVIDENCE_DIR: hil-evidence
        shell: python3 -I {0}
        run: |
          # Per configuration: this run's DEPLOYED record of the staged package, identity of this run / revision /
          # upstream run, staged == installed == ImagePath file, and every suite's JUnit + results document with real
          # passes and no failure.  Skipped is never a pass; a missing deployment or suite is HIL_NOT_EXECUTED.
          import glob, json, os, re, sys, xml.etree.ElementTree as ET

          SUITES = ['HardwareUnit', 'HardwareIntegration', 'HardwareMutation', 'HardwareMandatory']
          GAP = 'TC-HIL-COVERAGE-GAP-001'
          incomplete = []
          root = os.environ.get('HIL_EVIDENCE_DIR', 'hil-evidence')
          run_id, sha, up = os.environ.get('GITHUB_RUN_ID', ''), os.environ.get('HIL_HEAD_SHA', ''), os.environ.get('HIL_UPSTREAM_RUN_ID', '')
          staged = {'Debug': os.environ.get('HIL_STAGED_DEBUG', ''), 'Release': os.environ.get('HIL_STAGED_RELEASE', '')}
          bad, not_executed, rows, lines, known, identity_ok = [], [], [], [], set(), True
          if os.environ.get('GITHUB_RUN_ATTEMPT') != '1':
              bad.append('HIL re-run attempt %r: evidence of attempt 1 only' % os.environ.get('GITHUB_RUN_ATTEMPT'))
          for cfg, var in (('Debug', 'HIL_DEBUG'), ('Release', 'HIL_RELEASE')):
              job = 'hil-' + cfg.lower()
              b = os.path.join(root, 'hil-evidence-%s' % cfg)
              known.add(os.path.normpath(b))
              if os.environ.get(var) != 'success':
                  bad.append('%s result is %r (success required; skipped/blocked/failed is not hardware verification)' % (job, os.environ.get(var)))
              dep_f, idf = os.path.join(b, 'deployment.json'), os.path.join(b, 'hil-run-identity.json')
              if not os.path.isfile(dep_f):
                  not_executed.append('%s: no deployment record (staged driver never deployed)' % cfg); continue
              with open(dep_f, encoding='utf-8-sig') as fh:
                  dep = json.load(fh)
              if dep.get('verdict') != 'DEPLOYED':
                  not_executed.append('%s: deployment %s - %s' % (cfg, dep.get('verdict'), dep.get('reason'))); continue
              if not os.path.isfile(idf):
                  not_executed.append('%s: no run identity after deployment' % cfg); continue
              with open(idf, encoding='utf-8-sig') as fh:
                  ident = json.load(fh)
              for k, v in (('runId', run_id), ('runAttempt', '1'), ('sha', sha), ('headRevision', sha), ('upstreamRunId', up),
                           ('job', job), ('configuration', cfg), ('stagedDriverSha256', staged[cfg]), ('deploymentVerdict', 'DEPLOYED')):
                  if str(ident.get(k)) != v:
                      bad.append('%s: identity %s=%r, expected %r (not evidence of this run)' % (cfg, k, ident.get(k), v))
              ids = (('staged', staged[cfg]), ('installed', str(ident.get('installedDriverSha256'))), ('ImagePath file', str(ident.get('imagePathSha256'))))
              ok = all(re.fullmatch('[0-9A-F]{64}', v or '') for _, v in ids) and len({v for _, v in ids}) == 1
              identity_ok = identity_ok and ok
              lines.append('%s driver: %s; running image: %s' % (cfg, ('staged == installed == ImagePath file = %s' % staged[cfg]) if ok else
                           'STAGED_BUILD_NOT_TESTED: ' + ', '.join('%s=%s' % (k, v) for k, v in ids), ident.get('runningImageEvidence')))
              ce = (dep.get('crashEvidence') or {}).get('classification')
              if ce in ('CURRENT_RUN_INTERRUPTED',):
                  bad.append('%s: crash evidence %s - results of this run are void' % (cfg, ce))
              if ce == 'PREVIOUS_RUN_CRASHED':
                  lines.append('%s: previous HIL run crashed the machine (evidence attached to this run)' % cfg)
              for s in SUITES:
                  files = glob.glob(os.path.join(b, s, 'junit-%s-%s-*.xml' % (s, cfg)))
                  res = glob.glob(os.path.join(b, s, 'results-%s-%s-*.json' % (s, cfg)))
                  trace = glob.glob(os.path.join(b, s, 'traceability-summary-*.md'))
                  if len(trace) != 1:
                      bad.append('%s: %d traceability summary file(s) for %s' % (cfg, len(trace), s))
                  if len(files) != 1 or len(res) != 1:
                      not_executed.append('%s %s: %d JUnit / %d results file(s) (suite not executed to completion)' % (cfg, s, len(files), len(res))); continue
                  with open(res[0], encoding='utf-8-sig') as fh:
                      rd = json.load(fh)
                  if int(rd.get('executedCount') or 0) <= 0:
                      not_executed.append('%s %s: no test executed (%s)' % (cfg, s, rd.get('counts')))
                  n = f = sk = gap = 0
                  for c in ET.parse(files[0]).getroot().iter('testcase'):
                      n += 1
                      if (c.get('name') or '').startswith(GAP): gap += 1; continue   # required, not executed: neither pass nor skip
                      if c.find('failure') is not None or c.find('error') is not None: f += 1
                      elif c.find('skipped') is not None: sk += 1
                  cnt = rd.get('counts') or {}
                  ngap, ninc = max(gap, int(cnt.get('COVERAGE-GAP') or 0)), int(cnt.get('INCOMPLETE') or 0)
                  passed = n - gap - f - sk
                  rows.append('| %s | %s | %d | %d | %d | %d | %d | %s |' % (cfg, s, passed, f, sk, ngap + ninc, n, rd.get('overall')))
                  if ngap or ninc:
                      incomplete.append('%s %s: %d required test(s) NOT EXECUTED (coverage gap), %d INCOMPLETE' % (cfg, s, ngap, ninc))
                  if f > 0 or passed <= 0 or rd.get('overall') not in ('PASSED', 'INCOMPLETE') or (rd.get('overall') == 'INCOMPLETE' and not (ngap or ninc)):
                      bad.append('%s %s: %d passed, %d failed, overall %s' % (cfg, s, passed, f, rd.get('overall')))
          for x in glob.glob(os.path.join(root, '**', 'junit-*.xml'), recursive=True) + glob.glob(os.path.join(root, '**', 'traceability-summary-*.md'), recursive=True):
              if not any(os.path.normpath(x).startswith(k + os.sep) for k in known):
                  bad.append('evidence outside an identified bundle: %s' % x)
          if not_executed:
              verdict = 'HIL_NOT_EXECUTED'
          elif bad:
              verdict = 'FAILED'
          elif incomplete:
              verdict = 'INCOMPLETE'
          elif not identity_ok:
              verdict = 'STAGED_BUILD_NOT_TESTED'
              bad.append('STAGED_BUILD_NOT_TESTED: the driver under test is not the staged build of %s' % sha)
          else:
              verdict = 'PASSED'
          text = '## HIL acceptance: %s (run %s, %s, CI run %s)\n\n%s\n\n| Config | Suite | Pass | Fail | Skip | Not executed / incomplete | Total | Overall |\n|---|---|---|---|---|---|---|---|\n%s\n' % (
              verdict, run_id, sha, up, '\n\n'.join(lines), '\n'.join(rows))
          text += ''.join('- %s\n' % x for x in not_executed + bad + incomplete)
          if os.environ.get('GITHUB_OUTPUT'):
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
                  fh.write('verdict=%s\n' % verdict)
          if os.environ.get('GITHUB_STEP_SUMMARY'):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
                  fh.write(text)
          print(text)
          if verdict != 'PASSED':
              print('::error title=HIL acceptance %s::' % verdict + '; '.join(not_executed + bad + incomplete))
          sys.exit(0 if verdict == 'PASSED' else 1)

      - name: Publish HIL JUnit results
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: 'HIL Hardware Tests (run ${{ github.run_id }})'
          path: 'hil-evidence/hil-evidence-*/*/junit-*.xml'
          reporter: java-junit
          fail-on-error: 'false'
          fail-on-empty: 'false'

      - name: HIL traceability and coverage-gap summary
        if: always()
        run: |
          shopt -s nullglob
          {
            echo "## HIL traceability (run $GITHUB_RUN_ID)"
            echo ""
            echo "Required tests NOT EXECUTED (coverage gaps; acceptance INCOMPLETE until each has a verified fixture):"
            grep -ho 'TC-HIL-COVERAGE-GAP-001: [^ ]*' hil-evidence/hil-evidence-{Debug,Release}/*/junit-*.xml | sort | uniq -c || true
            for f in hil-evidence/hil-evidence-{Debug,Release}/*/traceability-summary-*.md; do echo ""; echo "### $f"; cat "$f"; done
          } >> "$GITHUB_STEP_SUMMARY"

  hil-gate:
    # Mandatory pre-merge gate (owner requirement 2026-10-30): the commit status 'HIL / pre-merge gate' on the PR HEAD
    # commit is the required check of the master ruleset.  Runs for EVERY pull-request CI completion (also fork, failed
    # CI, denied, skipped or failed HIL) so a missing HIL is always explained; GitHub-hosted, no checkout, never runs
    # repository code; writes only the status.  'success' only for a PASSED acceptance of Debug AND Release for exactly
    # the authorized head; a status is bound to one SHA, so a newer push carries no status and the merge stays blocked.
    name: HIL pre-merge gate (commit status)
    needs: [authorize, hil-debug, hil-release, hil-acceptance]
    if: ${{ always() && github.repository == 'zarfld/IntelAvbFilter' && github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: Pre-merge gate verdict
        id: gate
        env:
          AZ_RESULT: ${{ needs.authorize.result }}
          AZ_AUTHORIZED: ${{ needs.authorize.outputs.authorized }}
          AZ_MODE: ${{ needs.authorize.outputs.mode }}
          AZ_HEAD_SHA: ${{ needs.authorize.outputs.head_sha }}
          AZ_PR: ${{ needs.authorize.outputs.pr_number }}
          AZ_DENY: ${{ needs.authorize.outputs.deny_reasons }}
          DEBUG_RESULT: ${{ needs.hil-debug.result }}
          RELEASE_RESULT: ${{ needs.hil-release.result }}
          ACC_RESULT: ${{ needs.hil-acceptance.result }}
          ACC_VERDICT: ${{ needs.hil-acceptance.outputs.verdict }}
        shell: python3 -I {0}
        run: |
          # Inputs: the event file and the job results/outputs above only.  Always exits 0 with a verdict, except when
          # the event is unreadable (then no status is posted: the required check stays missing = merge blocked).
          import datetime, json, os, re, sys

          REPO = 'zarfld/IntelAvbFilter'
          E = os.environ.get
          with open(E('GITHUB_EVENT_PATH'), encoding='utf-8') as fh:
              wr = (json.load(fh) or {}).get('workflow_run') or {}
          sha = wr.get('head_sha') if isinstance(wr.get('head_sha'), str) else ''
          if not re.fullmatch('[0-9a-f]{40}', sha):
              print('::error title=HIL pre-merge gate::event head_sha %r is not a commit id; no status can be posted' % (sha,))
              sys.exit(1)
          prs = [p.get('number') for p in (wr.get('pull_requests') or []) if isinstance(p, dict)]
          head_repo = (wr.get('head_repository') or {}).get('full_name')
          res = {'authorize': E('AZ_RESULT'), 'authorized': E('AZ_AUTHORIZED'), 'mode': E('AZ_MODE'), 'authorizedHead': E('AZ_HEAD_SHA'),
                 'authorizedPullRequest': E('AZ_PR'), 'hil-debug': E('DEBUG_RESULT'), 'hil-release': E('RELEASE_RESULT'),
                 'hil-acceptance': E('ACC_RESULT'), 'acceptanceVerdict': E('ACC_VERDICT')}
          # First unmet prerequisite decides; every verdict except PASSED is 'failure'.
          if wr.get('event') != 'pull_request':
              verdict, why = 'INCONSISTENT', 'upstream event %r is not a pull request' % wr.get('event')
          elif wr.get('conclusion') != 'success':
              verdict, why = 'CI_NOT_SUCCESSFUL', 'upstream CI conclusion %r (all CI gates and staging must succeed before HIL)' % wr.get('conclusion')
          elif head_repo != REPO:
              verdict, why = 'NOT_ELIGIBLE', 'fork pull request (head repository %r) never reaches the HIL runner; the OWNER carries the change on a same-repository PR' % head_repo
          elif E('AZ_RESULT') != 'success' or E('AZ_AUTHORIZED') != 'true':
              verdict, why = 'NOT_AUTHORIZED', E('AZ_DENY') or 'authorize result %r, authorized %r' % (E('AZ_RESULT'), E('AZ_AUTHORIZED'))
          elif E('AZ_MODE') != 'pull_request' or E('AZ_HEAD_SHA') != sha or not re.fullmatch('[1-9][0-9]*', E('AZ_PR') or '') or int(E('AZ_PR')) not in prs:
              verdict, why = 'INCONSISTENT', 'authorized %r %r #%r is not this pull request CI head %s %r' % (E('AZ_MODE'), E('AZ_HEAD_SHA'), E('AZ_PR'), sha, prs)
          elif E('DEBUG_RESULT') != 'success' or E('RELEASE_RESULT') != 'success' or E('ACC_RESULT') != 'success' or E('ACC_VERDICT') != 'PASSED':
              av = E('ACC_VERDICT') or ''
              verdict = av if av and av != 'PASSED' else 'HIL_NOT_EXECUTED'
              why = 'hil-debug %r, hil-release %r, hil-acceptance %r verdict %r (Debug and Release must both pass; skipped/blocked/incomplete is not verification)' % (
                  E('DEBUG_RESULT'), E('RELEASE_RESULT'), E('ACC_RESULT'), av)
          else:
              verdict, why = 'PASSED', ''
          state = 'success' if verdict == 'PASSED' else 'failure'
          run = '%s/%s/actions/runs/%s' % (E('GITHUB_SERVER_URL', 'https://github.com'), E('GITHUB_REPOSITORY', REPO), E('GITHUB_RUN_ID'))
          desc = ('PASSED: Debug+Release physical HIL of %s' % sha[:12]) if state == 'success' else '%s: %s' % (verdict, why)
          desc = ' '.join(desc.split())[:140]
          doc = {'schema': 'avb-hil-gate/1', 'context': 'HIL / pre-merge gate', 'state': state, 'verdict': verdict,
                 'reasons': [why] if why else [], 'headSha': sha, 'pullRequests': prs, 'upstreamRunId': wr.get('id'),
                 'upstreamRunAttempt': wr.get('run_attempt'), 'hilRunId': E('GITHUB_RUN_ID'), 'hilRunAttempt': E('GITHUB_RUN_ATTEMPT'),
                 'hilRunUrl': run, 'evidenceClass': 'ci', 'results': res,
                 'recordedUtc': datetime.datetime.now(datetime.timezone.utc).isoformat()}
          d = os.path.join(E('RUNNER_TEMP', '.'), 'hil-gate')
          os.makedirs(d, exist_ok=True)
          with open(os.path.join(d, 'hil-gate-verdict.json'), 'w', encoding='utf-8') as fh:
              json.dump(doc, fh, indent=2)
          with open(E('GITHUB_OUTPUT'), 'a', encoding='utf-8') as fh:
              fh.write('state=%s\nverdict=%s\nsha=%s\ndescription=%s\n' % (state, verdict, sha, desc))
          text = '## HIL pre-merge gate: %s (%s) for %s\n\n%s\n' % (state, verdict, sha, why or 'Debug and Release physical HIL PASSED for exactly this head.')
          if E('GITHUB_STEP_SUMMARY'):
              with open(E('GITHUB_STEP_SUMMARY'), 'a', encoding='utf-8') as fh:
                  fh.write(text)
          print(text)

      - name: Post the commit status 'HIL / pre-merge gate'
        id: post
        env:
          STATE: ${{ steps.gate.outputs.state }}
          SHA: ${{ steps.gate.outputs.sha }}
          DESCRIPTION: ${{ steps.gate.outputs.description }}
          GH_TOKEN: ${{ github.token }}
        shell: python3 -I {0}
        run: |
          # Writes exactly one commit status on exactly the verdict's SHA; never 'pending', never without a verdict.
          # Fails the job (after posting) for every state but success, and whenever the status cannot be written.
          import json, os, re, sys, urllib.request
          CONTEXT = 'HIL / pre-merge gate'
          E = os.environ.get
          state, sha = E('STATE') or '', E('SHA') or ''
          if state not in ('success', 'failure') or not re.fullmatch('[0-9a-f]{40}', sha):
              print('::error title=HIL pre-merge gate::no valid verdict (state %r, sha %r); no status posted' % (state, sha))
              sys.exit(1)
          repo = E('GITHUB_REPOSITORY')
          body = {'state': state, 'context': CONTEXT, 'description': (E('DESCRIPTION') or state)[:140],
                  'target_url': '%s/%s/actions/runs/%s' % (E('GITHUB_SERVER_URL', 'https://github.com'), repo, E('GITHUB_RUN_ID'))}
          req = urllib.request.Request('%s/repos/%s/statuses/%s' % (E('GITHUB_API_URL') or 'https://api.github.com', repo, sha),
                                       data=json.dumps(body).encode('utf-8'), method='POST', headers={
              'Authorization': 'Bearer ' + (E('GH_TOKEN') or ''), 'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json', 'User-Agent': 'IntelAvbFilter-hil-gate'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  code = r.status
          except Exception as e:
              print('::error title=HIL pre-merge gate::status not written: %s: %s' % (type(e).__name__, e))
              sys.exit(1)
          if code != 201:
              print('::error title=HIL pre-merge gate::status API answered %s' % code)
              sys.exit(1)
          print('posted %s %r on %s: %s' % (CONTEXT, state, sha, body['description']))
          if state != 'success':
              print('::error title=HIL pre-merge gate %s::%s' % (state, body['description']))
              sys.exit(1)

      - name: Upload the gate verdict
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hil-gate-verdict
          path: ${{ runner.temp }}/hil-gate/
          if-no-files-found: ignore
